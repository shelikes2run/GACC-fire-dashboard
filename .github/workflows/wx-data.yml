# GACC Fire Weather app data → `wx-data` branch (read by docs/wx/ and the AGOL "GACC Fire Weather" map).
# National PSAs (gacc_config.py key RAWS), public FEMS daily summaries, no secrets.
#   current: last 30 days observed + 7-day forecast per PSA, alert levels, PSA polygons (twice a day)
#   baseline: 2005-2024 PSA percentiles incl. dry-side fuel moisture (first run, or "rebuild baseline")
name: Fire weather data

on:
  schedule:
    - cron: '35 13 * * *'      # ~6:35 PT
    - cron: '35 21 * * *'      # ~2:35 PT
  workflow_dispatch:
    inputs:
      rebuild_baseline:
        description: 'Rebuild the 2005-2024 baseline'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['site/build_wx.py', 'gacc_config.py', '.github/workflows/wx-data.yml']

permissions:
  contents: write

concurrency:
  group: wx-data
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'shelikes2run/GACC-fire-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: { path: src }
      - name: Check out wx-data branch (create if missing)
        run: |
          git clone --depth 1 --branch wx-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" out \
            || (mkdir out && cd out && git init -b wx-data && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git")
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet pandas numpy requests
      - uses: actions/cache@v4
        with:
          path: wx_cache
          key: wx-raw-2005-2024-v1
      - name: Baseline (2005-2024)
        if: ${{ inputs.rebuild_baseline || hashFiles('out/baseline.json') == '' }}
        run: python src/site/build_wx.py baseline out wx_cache
      - name: Current (30 days + 7-day forecast)
        run: python src/site/build_wx.py current out
      - name: Publish
        run: |
          cd out
          git config user.name  "wx-data bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -qm "fire weather data $(date -u +%FT%TZ)"
          git push -q origin wx-data
