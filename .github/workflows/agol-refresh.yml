# Refreshes the GACC Fire Wx layers in ArcGIS Online from the FEMS API.
#
# Repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   FEMS_API_KEY     FEMS API key
#   FEMS_USERNAME    FEMS account email
#   ARCGIS_API_KEY   NIFC AGOL developer credential — "API key credentials –
#                    Impersonates item owner" — see agol/EXPERIENCE_BUILDER_GUIDE.md §0
# Optional repository variable:
#   ARCGIS_URL       defaults to https://nifc.maps.arcgis.com
name: AGOL refresh

on:
  schedule:
    # ~06:40 and ~16:40 Pacific (cron is UTC; shifts an hour with DST)
    - cron: '40 13 * * *'
    - cron: '40 23 * * *'
  workflow_dispatch:
    inputs:
      gacc:
        description: 'Limit to GACC abbrevs, space-separated (blank = all), e.g. OSCC'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — build tables, upload CSVs as an artifact, do not touch AGOL'
        type: boolean
        default: false

concurrency:
  group: agol-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agol/requirements-agol.txt

      - name: Install
        run: pip install -r agol/requirements-agol.txt

      - name: Run pipeline
        env:
          FEMS_API_KEY: ${{ secrets.FEMS_API_KEY }}
          FEMS_USERNAME: ${{ secrets.FEMS_USERNAME }}
          ARCGIS_API_KEY: ${{ secrets.ARCGIS_API_KEY }}
          ARCGIS_URL: ${{ vars.ARCGIS_URL || 'https://nifc.maps.arcgis.com' }}
          GACC: ${{ github.event.inputs.gacc }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          args=""
          if [ -n "$GACC" ]; then args="$args --gacc $GACC"; fi
          if [ "$DRY_RUN" = "true" ]; then args="$args --dry-run --out-dir agol_out"; fi
          python agol/agol_pipeline.py $args

      - name: Upload dry-run CSVs
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: agol-dry-run
          path: agol_out/
