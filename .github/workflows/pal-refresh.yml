# CA PAL feed: reads the public CA PAL Combined Report and publishes
# pal_stations.geojson (+ a running PAL history) on the `pal-data` branch.
# The AGOL web map reads it from:
#   https://raw.githubusercontent.com/shelikes2run/GACC-fire-dashboard/pal-data/pal_stations.geojson
# No secrets needed.
name: PAL feed

on:
  schedule:
    - cron: '25 * * * *'          # hourly; the report is regenerated each morning (~03:15 PT)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pal/**', '.github/workflows/pal-refresh.yml']

permissions:
  contents: write

concurrency:
  group: pal-feed
  cancel-in-progress: false

jobs:
  pal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: src }

      - name: Check out pal-data branch (create if missing)
        run: |
          git clone --depth 1 --branch pal-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" out \
            || (mkdir out && cd out && git init -b pal-data && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git")

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Build GeoJSON
        run: |
          pip install --quiet requests
          python src/pal/pal_to_geojson.py out/pal_stations.geojson --history out/pal_history.csv

      - name: Publish
        run: |
          cd out
          git config user.name  "pal-feed bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -qm "PAL $(date -u +%FT%TZ)"
          git push -q origin pal-data
