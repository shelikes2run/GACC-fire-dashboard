name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python probe/probe.py
      - run: |
          git config user.name bot; git config user.email actions@users.noreply.github.com
          git add probe_out.json; git commit -qm "probe out"; git push -q origin HEAD:probe
