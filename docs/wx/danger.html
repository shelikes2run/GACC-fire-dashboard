<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CA Fire Danger Maps</title>
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="../assets/area.js"></script>
<script src="../assets/common.js"></script>
<script src="wx.js?v=20261108"></script>
<style>
  #map { height: min(76vh, 860px); border-radius: 8px; background: #dfe6ec; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
  .bar button { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 14px; padding: 4px 11px; font: inherit; font-size: 13px; cursor: pointer; }
  .bar button.on { background: #7fb3ff; color: #111; border-color: #7fb3ff; }
  .bar .lbl { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin-right: 4px; min-width: 64px; }
  .play button { border-radius: 6px; min-width: 34px; }
  #day { flex: 1; min-width: 160px; accent-color: #7fb3ff; }
  .ttl { font-weight: 700; font-size: 15px; margin: 8px 0 4px; }
  .ttl .badge { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 9px; margin-left: 6px; vertical-align: 2px; }
  .lgd { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: 12px; margin-top: 6px; }
  .lgd i { display: inline-block; width: 18px; height: 12px; border: 1px solid #555; border-radius: 2px; margin-right: 4px; vertical-align: -2px; }
  .leaflet-tooltip.st { font-size: 12px; line-height: 1.35; }
  .leaflet-tooltip.st table td { padding: 0 6px 0 0; }
  .xm { color: #222; font: 700 12px/12px sans-serif; text-shadow: 0 0 2px #fff; }
  body.embed header.top { display: none; }
  body.embed main { padding: 6px; }
  body.embed .panel { padding: 10px; }
  body.embed .bar .lbl { display: none; }
  body.embed .bar { margin: 3px 0; gap: 4px; }
  body.embed .bar button { padding: 3px 9px; font-size: 12px; }
  body.embed #map { height: calc(100vh - 210px); min-height: 380px; }
</style>
</head>
<body>
<header class="top">
  <h1>California Fire Danger Maps</h1>
  <div class="sub"><a href="index.html">All GACCs</a> · NFDRS 2016 · FEMS RAWS · statewide (ONCC + OSCC) and Hawaii</div>
</header>
<main>
  <section class="panel">
    <div class="bar" id="regions"><span class="lbl">Region</span></div>
    <div class="bar" id="metrics"><span class="lbl">Index</span></div>
    <div class="bar play"><span class="lbl">Day</span>
      <button id="b0" title="First day (Home)">|«</button><button id="bp" title="Previous day (←)">«</button>
      <button id="bplay" title="Play / pause (space)">▶</button><button id="bn" title="Next day (→)">»</button><button id="be" title="Last day (End)">»|</button>
      <input type="range" id="day" min="0" max="7" value="0"><span class="small muted" id="dayt"></span>
    </div>
    <div class="ttl" id="ttl"></div>
    <div id="map"></div>
    <div class="lgd" id="lgd"></div>
    <p class="note" id="note"></p>
    <div id="def"></div>
  </section>
</main>
<script>
if (Q.get('embed') === '1') document.body.classList.add('embed');
const DDATA = Q.get('data') || 'https://raw.githubusercontent.com/' + AREA.repo + '/danger-data/';
const PCTB = [60, 80, 90, 97], PCTL = ['0-60', '60-80', '80-90', '90-97', '97+'];
const FML = ['<1', '1-3', '3-5', '5-7', '7-9', '9-11', '11-13', '13-15', '15-17', '17-19', '19-21', '21+'];
const FMC = ['#a50026', '#d22c27', '#ef623e', '#fb9c59', '#fece7f', '#fff1aa', '#f1fad9', '#cdeaf3', '#9ccde2', '#6ba3cc', '#436fb1', '#313695'];
const pctCls = v => v >= 97 ? 4 : v >= 90 ? 3 : v >= 80 ? 2 : v >= 60 ? 1 : 0;
const fmCls = v => v < 1 ? 0 : Math.min(11, 1 + Math.floor((v - 1) / 2));
// Same classes and colors as the ONCC PSA Fire Danger Maps
const M = {
  bi: { name: 'Burning Index (BI)', short: 'BI', pct: true, labels: PCTL, colors: ['#41D34F', '#BEEEA6', '#DAE3F3', '#F7A3E1', '#EF43E3'], cls: pctCls },
  erc: { name: 'Energy Release Component (ERC)', short: 'ERC', pct: true, labels: PCTL, colors: ['#41D34F', '#BEEEA6', '#FFF2CC', '#FFC000', '#FF0000'], cls: pctCls },
  ic: { name: 'Ignition Component (IC)', short: 'IC', pct: true, labels: PCTL, colors: ['#215C98', '#A6C9EC', '#FFFFBF', '#FFC000', '#FF0000'], cls: pctCls },
  sc: { name: 'Spread Component (SC)', short: 'SC', pct: true, labels: PCTL, colors: ['#215C98', '#A6C9EC', '#FFFFBF', '#FFC000', '#A4861C'], cls: pctCls },
  fm100: { name: '100-hr fuel moisture', short: '100-hr', unit: '%', labels: FML, colors: FMC, cls: fmCls },
  fm1000: { name: '1000-hr fuel moisture', short: '1000-hr', unit: '%', labels: FML, colors: FMC, cls: fmCls },
  kbdi: { name: 'Keetch-Byram Drought Index (KBDI)', short: 'KBDI', labels: ['0-100', '100-200', '200-300', '300-400', '400-500', '500-600', '600-700', '700-800'],
    colors: ['#313695', '#598dc0', '#a3d3e6', '#e9f6e8', '#fee99d', '#fca55d', '#e34a33', '#a50026'], cls: v => Math.max(0, Math.min(7, Math.floor(v / 100))) },
  sfdi: { name: 'Severe Fire Danger Index (SFDI)', short: 'SFDI', pct: true, labels: ['Low', 'Moderate', 'High', 'Very High', 'Severe'],
    colors: ['#2B83BA', '#ABDDA4', '#FFFFBF', '#FDAE61', '#D7191C'], cls: pctCls },
};
const ORDER = ['bi', 'erc', 'ic', 'sc', 'fm100', 'fm1000', 'kbdi', 'sfdi'];
const S = { region: Q.get('region') === 'HI' ? 'HI' : 'CA', metric: M[Q.get('index')] ? Q.get('index') : 'bi', day: 0, playing: null };
let D, PSA, MAP, OVL, PSAL, STL, GRID = {};
const fmtDate = s => new Date(s + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const my = lat => Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360));
const ilat = y => (2 * Math.atan(Math.exp(y)) - Math.PI / 2) * 180 / Math.PI;

function regionBounds(r) {
  const b = L.geoJSON({ type: 'FeatureCollection', features: PSA.features.filter(f => f.properties.region === r) }).getBounds();
  return b.pad(0.02);
}
// grid in Web Mercator rows (so the image lines up with the map), K nearest stations per cell, inverse-distance weights
function grid(r) {
  if (GRID[r]) return GRID[r];
  const b = regionBounds(r), W = 420, x0 = b.getWest(), x1 = b.getEast(), y0 = my(b.getSouth()), y1 = my(b.getNorth());
  const H = Math.round(W * (y1 - y0) / ((x1 - x0) * Math.PI / 180)), K = 10;
  const st = D.stations.map((s, i) => [i, s[2], s[3], s[4]]).filter(s => s[3] === r);
  const nb = new Int32Array(W * H * K), wt = new Float32Array(W * H * K);
  const cos = Math.cos((b.getSouth() + b.getNorth()) / 2 * Math.PI / 180);
  for (let row = 0; row < H; row++) {
    const lat = ilat(y1 - (row + 0.5) / H * (y1 - y0));
    for (let col = 0; col < W; col++) {
      const lon = x0 + (col + 0.5) / W * (x1 - x0), best = [];
      for (const [i, sl, so] of st) {
        const dx = (so - lon) * cos, dy = sl - lat, d2 = dx * dx + dy * dy;
        if (best.length < K) { best.push([d2, i]); if (best.length === K) best.sort((a, c) => a[0] - c[0]); }
        else if (d2 < best[K - 1][0]) { let j = K - 1; while (j > 0 && best[j - 1][0] > d2) { best[j] = best[j - 1]; j--; } best[j] = [d2, i]; }
      }
      best.sort((a, c) => a[0] - c[0]);
      const o = (row * W + col) * K;
      for (let k = 0; k < K; k++) { const e = best[k] || [Infinity, -1]; nb[o + k] = e[1]; wt[o + k] = 1 / Math.max(e[0], 1e-6); }
    }
  }
  return (GRID[r] = { W, H, K, nb, wt, bounds: L.latLngBounds([ilat(y0), x0], [ilat(y1), x1]), x0, x1, y0, y1 });
}
function frame() {
  const g = grid(S.region), m = M[S.metric], vals = D.days[S.day][S.metric];
  const cv = document.createElement('canvas'); cv.width = g.W; cv.height = g.H;
  const cx = cv.getContext('2d'), img = cx.createImageData(g.W, g.H), cols = m.colors.map(hex);
  for (let c = 0; c < g.W * g.H; c++) {
    let s = 0, w = 0; const o = c * g.K;
    for (let k = 0; k < g.K; k++) { const i = g.nb[o + k]; if (i < 0) continue; const v = vals[i]; if (v === null || v === undefined) continue; s += v * g.wt[o + k]; w += g.wt[o + k]; }
    if (!w) continue;
    const rgb = cols[m.cls(s / w)];
    img.data[c * 4] = rgb[0]; img.data[c * 4 + 1] = rgb[1]; img.data[c * 4 + 2] = rgb[2]; img.data[c * 4 + 3] = 255;
  }
  cx.putImageData(img, 0, 0);
  // clip to the PSAs of the region
  const out = document.createElement('canvas'); out.width = g.W; out.height = g.H;
  const ox = out.getContext('2d'), px = ([lon, lat]) => [(lon - g.x0) / (g.x1 - g.x0) * g.W, (g.y1 - my(lat)) / (g.y1 - g.y0) * g.H];
  ox.beginPath();
  for (const f of PSA.features) { if (f.properties.region !== S.region) continue;
    const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
    for (const p of polys) for (const ring of p) ring.forEach((pt, j) => { const [x, y] = px(pt); j ? ox.lineTo(x, y) : ox.moveTo(x, y); }); }
  ox.fill('evenodd'); ox.globalCompositeOperation = 'source-in'; ox.drawImage(cv, 0, 0);
  if (OVL) OVL.setUrl(out.toDataURL()).setBounds(g.bounds); else OVL = L.imageOverlay(out.toDataURL(), g.bounds, { opacity: 0.85, pane: 'overlayPane' }).addTo(MAP);
}
function stations() {
  if (STL) STL.remove();
  STL = L.layerGroup().addTo(MAP);
  const m = M[S.metric], day = D.days[S.day];
  D.stations.forEach((s, i) => {
    if (s[4] !== S.region || s[5] !== (S.region === 'HI' ? 'HI' : 'CA')) return;    // stations in the state (others still shape the edges)
    const v = day[S.metric][i];
    const tip = () => {
      const row = k => { const x = day[k][i], raw = day[k + '_v'] ? day[k + '_v'][i] : null;
        return `<tr><td>${M[k].short}</td><td><b>${x === null || x === undefined ? '–' : M[k].pct ? (raw !== null && raw !== undefined && k !== 'sfdi' ? raw + ' · ' : '') + Math.round(x) + 'th pct' : x + (M[k].unit || '')}</b></td><td>${x === null || x === undefined ? '' : M[k].labels[M[k].cls(x)]}</td></tr>`; };
      return `<b>${esc(s[1])}</b> <span style="color:#666">(${s[0]})</span><br>${fmtDate(day.date)} · ${day.observed ? 'observed' : 'forecast'}<table>${ORDER.map(row).join('')}</table>`; };
    const mk = v === null || v === undefined
      ? L.marker([s[2], s[3]], { icon: L.divIcon({ className: 'xm', html: '×', iconSize: [12, 12] }), keyboard: false })
      : L.circleMarker([s[2], s[3]], { radius: dotR(), weight: MAP.getZoom() < 7 ? 0.6 : 1, color: '#222', fillColor: m.colors[m.cls(v)], fillOpacity: 1 });
    mk.bindTooltip(tip, { className: 'st', sticky: false, direction: 'top' }).addTo(STL);
  });
}
const dotR = () => MAP.getZoom() < 6.5 ? 2.6 : MAP.getZoom() < 8 ? 3.6 : 5;   // smaller dots statewide so the surface shows
function draw() {
  const m = M[S.metric], day = D.days[S.day];
  frame(); stations();
  const n = D.stations.filter((s, i) => s[4] === S.region && s[5] === (S.region === 'HI' ? 'HI' : 'CA')), have = D.stations.filter((s, i) => s[4] === S.region && s[5] === (S.region === 'HI' ? 'HI' : 'CA') && day[S.metric][i] !== null && day[S.metric][i] !== undefined).length;
  $('ttl').innerHTML = `${S.region === 'HI' ? 'Hawaii' : 'California'} ${esc(m.name)} — ${fmtDate(day.date)}<span class="badge" style="background:${day.observed ? '#2e7d32' : '#ff7a33'};color:#fff">${day.observed ? 'FEMS observed' : 'FEMS forecast, day ' + day.day}</span>`;
  $('lgd').innerHTML = `<span class="muted">${m.pct ? (S.metric === 'sfdi' ? 'SFDI class (Jolly et al. 2019)' : 'NFDRS percentile class') : 'Value class' + (m.unit ? ' (%)' : '')}:</span>` +
    m.labels.map((l, i) => `<span><i style="background:${m.colors[i]}"></i>${l}</span>`).join('') + `<span class="muted">· ${have} of ${n.length} RAWS reporting · × = no data</span>`;
  $('day').value = S.day; $('dayt').textContent = `${S.day ? 'Day ' + S.day + ' forecast' : 'Day 0 observed'} · ${fmtDate(day.date)}`;
  document.querySelectorAll('#metrics button').forEach(b => b.classList.toggle('on', b.dataset.k === S.metric));
  document.querySelectorAll('#regions button').forEach(b => b.classList.toggle('on', b.dataset.r === S.region));
  if (typeof defBox === 'function') $('def').innerHTML = defBox({ fm100: 'fm100', fm1000: 'fm1000' }[S.metric] || S.metric);
}
function setRegion(r) { S.region = r; MAP.fitBounds(regionBounds(r)); PSAL.eachLayer(l => l.setStyle(psaStyle(l.feature))); draw(); }
const psaStyle = f => ({ color: f.properties.region === S.region ? '#333' : '#999', weight: f.properties.region === S.region ? 0.9 : 0.4, fill: false });
function step(d) { S.day = (S.day + d + D.days.length) % D.days.length; draw(); }
function play() { if (S.playing) { clearInterval(S.playing); S.playing = null; $('bplay').textContent = '▶'; } else { S.playing = setInterval(() => step(1), 1100); $('bplay').textContent = '❚❚'; } }
(async function () {
  [D, PSA] = await Promise.all([fetch(DDATA + 'danger.json?t=' + (Date.now() / 6e5 | 0)).then(r => r.json()), fetch(DDATA + 'danger_psa.geojson?t=' + (Date.now() / 6e5 | 0)).then(r => r.json())]);
  MAP = L.map('map', { zoomSnap: 0.25 });
  L.tileLayer('https://services.arcgisonline.com/arcgis/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 13, attribution: 'Esri, HERE, Garmin, © OpenStreetMap contributors' }).addTo(MAP);
  MAP.createPane('lines').style.zIndex = 420;
  MAP.on('zoomend', () => STL && STL.eachLayer(l => l.setRadius && l.setStyle({ radius: dotR(), weight: MAP.getZoom() < 7 ? 0.6 : 1 }) && l.setRadius(dotR())));
  PSAL = L.geoJSON(PSA, { pane: 'lines', style: psaStyle, onEachFeature: (f, l) => l.bindTooltip(`${esc(f.properties.PSANationalCode)} ${esc(f.properties.PSANAME)}`, { sticky: true }) }).addTo(MAP);
  $('regions').insertAdjacentHTML('beforeend', [['CA', document.body.classList.contains('embed') ? 'California' : 'California (ONCC + OSCC)'], ['HI', 'Hawaii']].map(([r, t]) => `<button data-r="${r}">${t}</button>`).join(''));
  $('metrics').insertAdjacentHTML('beforeend', ORDER.map(k => `<button data-k="${k}">${M[k].short}</button>`).join(''));
  document.querySelectorAll('#regions button').forEach(b => b.onclick = () => setRegion(b.dataset.r));
  document.querySelectorAll('#metrics button').forEach(b => b.onclick = () => { S.metric = b.dataset.k; draw(); });
  $('day').max = D.days.length - 1; $('day').oninput = e => { S.day = +e.target.value; draw(); };
  $('b0').onclick = () => { S.day = 0; draw(); }; $('be').onclick = () => { S.day = D.days.length - 1; draw(); };
  $('bp').onclick = () => step(-1); $('bn').onclick = () => step(1); $('bplay').onclick = play;
  document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
    if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'Home') { S.day = 0; draw(); }
    else if (e.key === 'End') { S.day = D.days.length - 1; draw(); } else if (e.key === ' ') { e.preventDefault(); play(); } });
  $('note').innerHTML = `RAWS values from FEMS (fuel model ${esc(D.fuel_model)}), interpolated between stations (inverse distance, 10 nearest) and clipped to the PSAs; stations just outside the state shape the edges. ` +
    `BI, ERC, IC and SC: each station's percentile within its own ${D.climo[0]}–${D.climo[1]} record (all days of the year). SFDI (Jolly et al. 2019): ERC percentile × BI percentile, ranked within the station's own record. ` +
    `100-hr, 1000-hr and KBDI: the values. Day 0 is the latest observed day, days 1–7 the FEMS forecast. Same classes and colors as the ONCC PSA Fire Danger Maps. Updated ${esc(D.generated)}. Experimental.`;
  setRegion(S.region);
})().catch(e => { $('map').innerHTML = '<p class="muted" style="padding:20px">Fire danger map data is not available yet.</p>'; console.error(e); });
</script>
</body>
</html>
